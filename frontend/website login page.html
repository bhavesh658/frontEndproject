<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyPlanner - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="images/login.png" alt="User photo Logo">
        </div>
        <h2>Login to BookMyPlanner</h2>
        <form id="loginForm" action="http://localhost:5000/api/auth/signin" method="POST">
            <input type="text" name="name" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="signup-link">Don't have an account? <a href="signuppage.html">Sign up</a></p>
        <a href="forgetpage.html" class="forget-password"> forget password</a>
    </div>
</body>
<script>


    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // prevent page reload
         console.log('Form submitted');
        // Get form values
        const name = e.target.name.value;
        const password = e.target.password.value;

        try {
            const response = await fetch('http://localhost:3000/api/auth/signin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, password })
            });

            if (response.ok) {
                const data = await response.json();
                console.log('Login successful:', data);

                // Save token in localStorage (example)
                localStorage.setItem('token', data.token);

                // Redirect user to home page or dashboard
                window.location.href = 'index.html';
            } else {
                const errorData = await response.json();
                alert('Login failed: ' + errorData.message);
            }

        } catch (error) {
            console.error('Error during login:', error);
            alert('An error occurred. Please try again.');
        }
    });
</script>

</html>
